<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />
    <title>Wheelchair Racing</title>
    <style>
      /* Loading Screen styling */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(135deg, #0f0c20 0%, #15102a 50%, #06050b 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      
      .loading-container {
        text-align: center;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        padding: 40px 60px;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        max-width: 480px;
        width: 85%;
      }
      
      .loading-container h1 {
        font-size: 2.2rem;
        font-weight: 800;
        background: linear-gradient(45deg, #00f2fe 0%, #4facfe 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin: 0 0 30px 0;
        letter-spacing: 2px;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      
      .loading-spinner-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 25px;
      }
      
      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(0, 242, 254, 0.1);
        border-top-color: #00f2fe;
        border-radius: 50%;
        animation: spin 1s infinite linear;
        margin-bottom: 15px;
        box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
      }
      
      .loading-text {
        font-size: 1rem;
        color: #a0a0c0;
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-weight: 500;
      }
      
      .progress-bar-container {
        width: 100%;
        height: 6px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 3px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      
      .progress-bar {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #00f2fe, #4facfe);
        border-radius: 3px;
        transition: width 0.2s ease;
        box-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #000;
        user-select: none;
        -webkit-user-select: none;
        overscroll-behavior: none;
      }
      #app {
        width: 100vw;
        height: 100vh;
      }
      #ui {
        position: absolute;
        top: 20px;
        left: 20px;
        color: white;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 1.5rem;
        font-weight: bold;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        pointer-events: none;
        z-index: 5;
      }
      #controls-help {
        position: absolute;
        bottom: 20px;
        right: 20px;
        color: rgba(255, 255, 255, 0.7);
        font-family: monospace;
        font-size: 1rem;
        pointer-events: none;
        text-align: right;
        z-index: 5;
      }
      
      /* Mobile Controls UI Styling */
      #mobile-controls {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10;
      }
      
      #joystick-base {
        position: absolute;
        bottom: 80px;
        left: 80px;
        width: 128px;
        height: 128px;
        pointer-events: auto;
        touch-action: none;
        opacity: 0.8;
        transition: opacity 0.2s ease;
      }
      
      #joystick-pad-svg {
        width: 128px;
        height: 128px;
        display: block;
      }
      
      #joystick-nub {
        position: absolute;
        left: 32px;
        top: 32px;
        width: 64px;
        height: 64px;
        pointer-events: none;
        transform: translate(0px, 0px);
      }
      
      #joystick-nub-svg {
        width: 64px;
        height: 64px;
        display: block;
      }
      
      #mobile-jump-btn {
        position: absolute;
        bottom: 104px;
        right: 80px;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.15);
        border: 2px solid rgba(255, 255, 255, 0.35);
        color: #ffffff;
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-weight: bold;
        font-size: 1.1rem;
        text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.6);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        pointer-events: auto;
        touch-action: none;
        display: flex;
        align-items: center;
        justify-content: center;
        outline: none;
        user-select: none;
        -webkit-user-select: none;
        transition: transform 0.1s ease, background-color 0.1s ease, border-color 0.1s ease;
      }

      #mobile-fullscreen-btn {
        position: absolute;
        top: calc(env(safe-area-inset-top, 0px) + 16px);
        right: calc(env(safe-area-inset-right, 0px) + 16px);
        min-width: 120px;
        height: 44px;
        padding: 0 16px;
        border-radius: 999px;
        background: rgba(10, 16, 28, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.22);
        color: #ffffff;
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 0.92rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
        pointer-events: auto;
        touch-action: manipulation;
        display: none;
        align-items: center;
        justify-content: center;
        outline: none;
        user-select: none;
        -webkit-user-select: none;
      }

      #mobile-fullscreen-btn:active {
        transform: scale(0.96);
      }
      
      #mobile-jump-btn:active {
        transform: scale(0.9);
        background: rgba(255, 255, 255, 0.3);
        border-color: rgba(255, 255, 255, 0.6);
      }

      /* Adjustments for smaller landscape mobile screens */
      @media (max-height: 500px) {
        #joystick-base {
          bottom: 40px;
          left: 40px;
          transform: scale(0.85);
        }
        #mobile-jump-btn {
          bottom: 60px;
          right: 40px;
          transform: scale(0.85);
        }
        #mobile-jump-btn:active {
          transform: scale(0.75);
        }
        #ui {
          font-size: 1.2rem;
          top: 10px;
          left: 10px;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/",
          "@dimforge/rapier3d-compat": "https://esm.sh/@dimforge/rapier3d-compat@0.19.3",
          "@dimforge/rapier3d": "https://esm.sh/@dimforge/rapier3d-compat@0.19.3"
        }
      }
    </script>
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="loading-screen">
      <div class="loading-container">
        <h1>WHEELCHAIR CHAMPIONSHIP</h1>
        <div class="loading-spinner-container">
          <div class="loading-spinner"></div>
          <div class="loading-text" id="loading-text">Loading physics engine...</div>
        </div>
        <div class="progress-bar-container">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
      </div>
    </div>

    <div id="ui">Speed: <span id="speedDisplay">0</span> km/h</div>
    <div id="controls-help">
      W / S : Accelerate / Brake<br>
      A / D : Steer<br>
      Space : Jump/Kick<br>
      F1 : Collision Debug
    </div>
    <div id="app"></div>
    
    <!-- Mobile Controls Overlay -->
    <div id="mobile-controls" style="display: none;">
      <div id="joystick-base">

        </div>
      </div>
      <button id="mobile-fullscreen-btn" type="button">FULLSCREEN</button>
      <button id="mobile-jump-btn">JUMP</button>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
